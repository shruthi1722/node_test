name: Build and Test Pipeline

on: [push, pull_request] # What triggers the build

jobs:
  build-project:
    runs-on: ubuntu-latest # The operating system environment
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run automated tests
      run: npm test

    - name: Build production package
      run: npm run build

