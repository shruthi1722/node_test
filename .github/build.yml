name: Node.js CI Pipeline

on:
  push:
    branches:
        - SCRUM-6-APSIT-website-faculty-profile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: seetup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

 - name: Install Dependencies
        run: npm install
